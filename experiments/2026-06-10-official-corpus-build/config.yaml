  - slug: 296_ciam_tc
    raw_md: ../trial_june-9th-ocr_results/content/output_md/296_ciam_tc/296_ciam_tc.md
    source: "CIAM Terminale C — Calcul intégral"
  - slug: 322_ciam_tc
    raw_md: ../trial_june-9th-ocr_results/content/output_md/322_ciam_tc/322_ciam_tc.md
    source: "CIAM Terminale C — Équations différentielles"
  - slug: bac-2022-maths-tc
    raw_md: ../trial_june-9th-ocr_results/content/output_md/bac-2022-maths-tc/bac-2022-maths-tc.md
