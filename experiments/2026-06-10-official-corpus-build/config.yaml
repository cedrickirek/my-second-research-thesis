  # BAC 2025 is the HELD-OUT evaluation year: it is the source of the 9 BAC-2025
  # queries in data/eval/queries.jsonl and must NEVER be indexed, or those
  # queries could retrieve their own solutions (data leakage). Its OCR stays in
  # data/ocr/bac-2025-maths-tc/ for query provenance, but it is deliberately
  # absent from this document list. Do not re-add it.
  # See decisions/2026-06-17-bac-2025-held-out.md.
